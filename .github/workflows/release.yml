# Publica una release estable con Velopack al fusionar en main (#181): 0.FASE.N, con la N de la punta de dev que se
# fusiona (#207). La app la toma del canal Estable (#180).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # La N de la punta de dev que se fusionó (#207): la misma de su última prerelease.
      - name: Versión (0.FASE.N, #207)
        id: version
        shell: pwsh
        run: |
          $rev = if (git rev-parse -q --verify HEAD^2) { 'HEAD^2' } else { 'HEAD' }
          "valor=$(./scripts/version.ps1 -Rev $rev)" >> $env:GITHUB_OUTPUT

      - name: Pruebas
        run: dotnet test -c Release

      - name: Instalar vpk
        run: dotnet tool install -g vpk

      - name: Empaquetar
        shell: pwsh
        run: ./scripts/empaquetar.ps1 -Version ${{ steps.version.outputs.valor }}

      - name: Subir a GitHub Releases
        run: vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --outputDir artefactos/paquetes --publish --releaseName "Otteretro ${{ steps.version.outputs.valor }}" --tag v${{ steps.version.outputs.valor }}
