# Publica una prerelease con Velopack en cada push a dev (#179, #180): 0.FASE.N-dev (#207: N sube con cada PR fusionado), en el canal «dev» de Velopack.
# La app la toma solo con el canal Pruebas; las estables la ignoran.
name: Prerelease

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Versión (0.FASE.N-dev, #207)
        id: version
        shell: pwsh
        run: |
          "valor=$(./scripts/version.ps1)-dev" >> $env:GITHUB_OUTPUT

      - name: Pruebas
        run: dotnet test -c Release

      - name: Instalar vpk
        run: dotnet tool install -g vpk

      - name: Empaquetar
        shell: pwsh
        run: ./scripts/empaquetar.ps1 -Version ${{ steps.version.outputs.valor }} -Channel dev

      - name: Subir a GitHub Releases
        run: vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --outputDir artefactos/paquetes --channel dev --pre --publish --releaseName "Otteretro ${{ steps.version.outputs.valor }}" --tag v${{ steps.version.outputs.valor }}
